spring.application.name=library
# Spring's own errors (e.g. malformed requests) as problem details too, like the adapter's own.
spring.mvc.problemdetails.enabled=true

# Matches compose.yaml in the project root. Override with SPRING_DATASOURCE_URL etc. for another database.
spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=library
spring.datasource.password=library
# The schema comes from the Flyway migrations in adapter-persistence. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Transactions are per use case (LendingConfiguration), not per web request.
spring.jpa.open-in-view=false
